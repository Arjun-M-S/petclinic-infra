name: terraform-destroy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  destroy-addons:
    runs-on: ubuntu-latest
    environment: production   # manual approval gate — this is destructive
    defaults:
      run:
        working-directory: addons
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-2
          role-skip-session-tagging: true

      - name: Delete LoadBalancer services first
        run: |
          aws eks update-kubeconfig --name petclinic-eks-cluster --region ap-south-2
          kubectl delete svc api-gateway -n default --ignore-not-found
          kubectl delete svc argocd-server -n argocd --ignore-not-found
          echo "Waiting for AWS to deprovision associated ELBs/security groups..."
          sleep 90

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - run: terraform init
      - run: terraform plan -destroy -out=destroy-plan
      - run: terraform apply -auto-approve destroy-plan

  destroy-core:
    needs: destroy-addons
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-2
          role-skip-session-tagging: true

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - run: terraform init
      - run: terraform plan -destroy -out=destroy-plan
      - run: terraform apply -auto-approve destroy-plan